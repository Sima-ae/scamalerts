# Build on GitHub Actions (modern glibc), deploy standalone artifact to VPS.
# The VPS glibc is too old for @next/swc-linux-x64-gnu (needs GLIBC_2.29+),
# so we never run `next build` on the server.
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_PATH (optional)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-all-scams
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build Next.js
        env:
          AUTH_SECRET: "ci-build-placeholder-not-used-at-runtime"
          AUTH_URL: "https://all-scams.com"
          NEXT_PUBLIC_APP_URL: "https://all-scams.com"
          NEXT_PUBLIC_SITE_NAME: "All Scams"
          NEXT_PUBLIC_SITE_DOMAIN: "all-scams.com"
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
        run: npm run build

      - name: Pack standalone release
        run: |
          set -euo pipefail
          ROOT=/tmp/all-scams-release
          rm -rf "$ROOT"
          mkdir -p "$ROOT/.next/standalone/.next"

          # PM2 runs: APP_DIR/.next/standalone/server.js
          cp -a .next/standalone/. "$ROOT/.next/standalone/"
          cp -a .next/static "$ROOT/.next/standalone/.next/static"
          cp -a public "$ROOT/.next/standalone/public"

          # Next standalone tracing often omits extra Prisma engine binaries.
          # VPS needs rhel-openssl-1.1.x (generated via schema binaryTargets).
          mkdir -p "$ROOT/.next/standalone/node_modules/.prisma/client"
          mkdir -p "$ROOT/.next/standalone/node_modules/@prisma/client"
          cp -a node_modules/.prisma/client/. \
            "$ROOT/.next/standalone/node_modules/.prisma/client/"
          if [[ -d node_modules/@prisma/client ]]; then
            cp -a node_modules/@prisma/client/. \
              "$ROOT/.next/standalone/node_modules/@prisma/client/" 2>/dev/null || true
          fi
          test -f "$ROOT/.next/standalone/node_modules/.prisma/client/libquery_engine-rhel-openssl-1.1.x.so.node"

          cp -a prisma "$ROOT/prisma"
          cp -a scripts "$ROOT/scripts"
          cp package.json package-lock.json ecosystem.config.cjs "$ROOT/"

          tar -C "$ROOT" -czf /tmp/all-scams-release.tar.gz .
          ls -lh /tmp/all-scams-release.tar.gz
          echo "Prisma engines in package:"
          ls "$ROOT/.next/standalone/node_modules/.prisma/client"/libquery_engine* || true

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${VPS_HOST// }" ]] && missing+=("VPS_HOST")
          [[ -z "${VPS_USER// }" ]] && missing+=("VPS_USER")
          [[ -z "${SSH_KEY// }" ]] && missing+=("VPS_SSH_KEY")
          if ((${#missing[@]})); then
            echo "ERROR: Missing secrets: ${missing[*]}"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          KEY_FILE=~/.ssh/id_deploy
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o IdentitiesOnly=yes -i "$KEY_FILE")
          APP_DIR="${VPS_APP_PATH:-/home/all-scams.com/app}"

          scp "${SSH_OPTS[@]}" /tmp/all-scams-release.tar.gz \
            "${VPS_USER}@${VPS_HOST}:/tmp/all-scams-release.tar.gz"

          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
          set -euo pipefail
          APP_DIR="${APP_DIR}"

          if [[ -x "\$APP_DIR/scripts/ensure-free-port.sh" ]]; then
            bash "\$APP_DIR/scripts/ensure-free-port.sh" 3010 all-scams || true
          fi

          ENV_BAK=""
          if [[ -f "\$APP_DIR/.env" ]]; then
            ENV_BAK=\$(mktemp)
            cp -a "\$APP_DIR/.env" "\$ENV_BAK"
          fi

          mkdir -p "\$APP_DIR"
          tar -xzf /tmp/all-scams-release.tar.gz -C "\$APP_DIR"
          rm -f /tmp/all-scams-release.tar.gz

          if [[ -n "\$ENV_BAK" ]]; then
            cp -a "\$ENV_BAK" "\$APP_DIR/.env"
            cp -a "\$ENV_BAK" "\$APP_DIR/.next/standalone/.env"
            rm -f "\$ENV_BAK"
          elif [[ -f "\$APP_DIR/.env" ]]; then
            cp -a "\$APP_DIR/.env" "\$APP_DIR/.next/standalone/.env"
          fi

          cd "\$APP_DIR"
          npx --yes prisma@6.19.3 migrate deploy --schema=prisma/schema.prisma

          test -f .next/standalone/server.js

          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          sleep 3
          CODE=\$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/ || echo 000)
          echo "Health: \$CODE"
          test "\$CODE" = "200"
          echo "Deployed all-scams.com on port 3010"
          EOF
